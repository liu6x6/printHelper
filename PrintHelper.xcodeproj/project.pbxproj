		21A34CE18C5D8660B7DF0AC5 /* Install built macOS app */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Install built macOS app";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "#!/bin/sh\nif [ -n \"${ZSH_VERSION:-}\" ]; then\n  emulate -L sh\nfi\nset -eu\n\nif [ \"$#\" -gt 2 ]; then\n  printf 'Usage: %s [app-path [destination-directory]]\\n' \"$0\" >&2\n  exit 64\nfi\n\napp_path=\"${1:-}\"\ndestination_directory=\"${2:-${INSTALL_APP_DESTINATION:-/Applications}}\"\n\nif [ -z \"$app_path\" ]; then\n  if [ -n \"${INSTALL_APP_BUNDLE_NAME:-}\" ]; then\n    if [ -z \"${BUILT_PRODUCTS_DIR:-}\" ]; then\n      printf '%s\\n' 'Xcode did not provide BUILT_PRODUCTS_DIR. Build the Install App scheme from Xcode.' >&2\n      exit 66\n    fi\n    app_path=\"$BUILT_PRODUCTS_DIR/$INSTALL_APP_BUNDLE_NAME\"\n  fi\n\nfi\n\nif [ -z \"$app_path\" ]; then\n  case \"${FULL_PRODUCT_NAME:-}\" in\n    *.app)\n      if [ -n \"${TARGET_BUILD_DIR:-}\" ] &&\n        [ -d \"$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME\" ]; then\n        app_path=\"$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME\"\n      fi\n      ;;\n  esac\n\n  if [ -z \"$app_path\" ]; then\n    products_directory=\"${BUILT_PRODUCTS_DIR:-${TARGET_BUILD_DIR:-}}\"\n    if [ -z \"$products_directory\" ] || [ ! -d \"$products_directory\" ]; then\n      printf '%s\\n' 'Cannot locate Xcode build products. Run this script from an Xcode Run Script phase, or pass an app path.' >&2\n      exit 66\n    fi\n\n    app_count=0\n    for candidate in \"$products_directory\"/*.app; do\n      [ -d \"$candidate\" ] || continue\n      app_count=$((app_count + 1))\n      app_path=\"$candidate\"\n    done\n\n    if [ \"$app_count\" -ne 1 ]; then\n      printf 'Expected one app in %s, found %s. Build the App target first; if multiple apps exist, pass the desired app path.\\n' \"$products_directory\" \"$app_count\" >&2\n      for candidate in \"$products_directory\"/*.app; do\n        [ -d \"$candidate\" ] || continue\n        printf '  %s\\n' \"$candidate\" >&2\n      done\n      exit 66\n    fi\n  fi\nfi\n\napp_path=\"${app_path%/}\"\n\nif [ ! -d \"$app_path\" ] || [ \"${app_path##*.}\" != \"app\" ]; then\n  printf 'App bundle not found: %s\\n' \"$app_path\" >&2\n  exit 66\nfi\n\nif [ ! -d \"$destination_directory\" ]; then\n  printf 'Destination directory not found: %s\\n' \"$destination_directory\" >&2\n  exit 73\nfi\n\napp_path=\"$(cd \"$(dirname \"$app_path\")\" && pwd -P)/$(basename \"$app_path\")\"\ndestination_directory=\"$(cd \"$destination_directory\" && pwd -P)\"\ndestination_path=\"$destination_directory/${app_path##*/}\"\n\nif [ -w \"$destination_directory\" ]; then\n  /usr/bin/ditto \"$app_path\" \"$destination_path\"\nelse\n  /usr/bin/osascript \\\n    -e 'on run argv' \\\n    -e 'do shell script (\"/usr/bin/ditto \" & quoted form of (item 1 of argv) & \" \" & quoted form of (item 2 of argv)) with administrator privileges' \\\n    -e 'end run' \\\n    \"$app_path\" \"$destination_path\"\nfi\n\nprintf 'Installed %s to %s\\n' \"${app_path##*/}\" \"$destination_path\"\n";
		};
