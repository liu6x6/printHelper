<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6BA6FF"/>
      <stop offset="1" stop-color="#2E63E8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#CFE3FF"/>
    </linearGradient>
    <clipPath id="photoClip">
      <rect x="322" y="225" width="380" height="250" rx="16"/>
    </clipPath>
    <filter id="pageShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#1A3C8F" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- 后页：暗示自动扩展多页 -->
  <g transform="rotate(8 600 450)">
    <rect x="360" y="140" width="440" height="622" rx="22" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- 前页：A4 -->
  <rect x="282" y="180" width="460" height="650" rx="24" fill="#FFFFFF" filter="url(#pageShadow)"/>

  <!-- 页面内容：照片 -->
  <rect x="322" y="225" width="380" height="250" rx="16" fill="url(#sky)"/>
  <g clip-path="url(#photoClip)">
    <circle cx="630" cy="292" r="27" fill="#FFC94D"/>
    <path d="M322 475 L455 330 L590 475 Z" fill="#7FB0FF"/>
    <path d="M470 475 L600 355 L702 475 Z" fill="#4C86F0"/>
  </g>

  <!-- 页面内容：文字行 -->
  <g fill="#C7D5EC">
    <rect x="322" y="575" width="380" height="22" rx="11"/>
    <rect x="322" y="620" width="310" height="22" rx="11"/>
    <rect x="322" y="665" width="355" height="22" rx="11"/>
    <rect x="322" y="710" width="260" height="22" rx="11"/>
  </g>

  <!-- 切割虚线 -->
  <line x1="302" y1="520" x2="722" y2="520" stroke="#FF5A5F" stroke-width="9"
        stroke-dasharray="26 16" stroke-linecap="round"/>

  <!-- 剪刀（白色描边光晕 + 红色主体） -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#FFFFFF" stroke-width="24">
      <path d="M545 486 L660 536 L676 543"/>
      <path d="M545 554 L660 504 L676 497"/>
      <circle cx="694" cy="550" r="18"/>
      <circle cx="694" cy="490" r="18"/>
    </g>
    <g stroke="#FF5A5F" stroke-width="12">
      <path d="M545 486 L660 536 L676 543"/>
      <path d="M545 554 L660 504 L676 497"/>
      <circle cx="694" cy="550" r="18"/>
      <circle cx="694" cy="490" r="18"/>
    </g>
    <circle cx="623" cy="520" r="6" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>