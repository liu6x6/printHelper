name: PrintHelper
options:
  bundleIdPrefix: com.xiaolong
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  PrintHelper:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - PrintHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaolong.PrintHelper
        PRODUCT_NAME: PrintHelper
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZH6TQH466Q
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # 自带 Info.plist（含打印 Bonjour / 相册 / .phdoc 文档类型声明）
        # 注意：GENERATE_INFOPLIST_FILE = YES 仍会把 INFOPLIST_KEY_* 合并进去
        INFOPLIST_FILE[sdk=iphoneos*]: Support/Info-iOS.plist
        INFOPLIST_FILE[sdk=iphonesimulator*]: Support/Info-iOS.plist
        INFOPLIST_FILE[sdk=macosx*]: Support/Info-macOS.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
          CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: PrintHelper/PrintHelper.entitlements
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
          CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: PrintHelper/PrintHelper.entitlements
          ENABLE_HARDENED_RUNTIME: NO
schemes:
  PrintHelper:
    build:
      targets:
        PrintHelper: all
    run:
      config: Debug
    archive:
      config: Release